services:
  - type: web
    name: kolwa-billing
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: INITIAL_ADMIN_USERNAME
        value: Kolwa
      - key: INITIAL_ADMIN_PASSWORD
        value: 1234
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
